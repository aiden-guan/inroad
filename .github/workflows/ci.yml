name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Electron is for the Mac app (desktop.yml); these jobs never start it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # "true" only when the repository has the secret (never on forks), so the paid evals run only then.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency security audit
        run: node scripts/audit.mjs

      # PageProps, LayoutProps and RouteContext are generated by Next; tsc needs them on a fresh checkout.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Test
        run: npm test

      # The draft-quality evals against the mock: checks the harness, judges nothing, costs nothing.
      - name: Evals (mock model)
        run: npm run eval:critic && npm run eval:classify
        env:
          EVAL_MOCK: "1"
          GTM_DATA_DIR: ${{ runner.temp }}/inroad-eval-mock

      # The real gates (SPEC §4.0): fail the build when the critic or the reply reader regresses. About $0.15 a run.
      - name: Evals (real model)
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: npm run eval:critic && npm run eval:classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GTM_DATA_DIR: ${{ runner.temp }}/inroad-eval

      - name: Build
        run: npx next build
        env:
          # The build must never read or write a real workspace.
          GTM_DATA_DIR: ${{ runner.temp }}/inroad-data

  # A founder's first session in Chromium, against the mock Anthropic API with outbound DNS off: no key, no spend.
  e2e:
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.56 can't install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Electron is for the Mac app (desktop.yml); these jobs never start it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npm run e2e
        env:
          E2E_DATA_DIR: ${{ runner.temp }}/inroad-e2e-data

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
