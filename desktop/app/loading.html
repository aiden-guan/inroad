<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Inroad</title>
    <style>
      :root {
        --bg: #faf9f6;
        --fg: #1a1917;
        --fg-3: #8a867d;
        --accent: #2d4fd6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121110;
          --fg: #f2f0eb;
          --fg-3: #8f8b83;
          --accent: #7c93ff;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .orb {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, color-mix(in oklab, var(--accent) 35%, white) 0%, var(--accent) 52%, color-mix(in oklab, var(--accent) 70%, black) 100%);
        animation: breathe 1.6s ease-in-out infinite;
      }
      p {
        margin: 0;
        color: var(--fg-3);
      }
      @keyframes breathe {
        50% {
          transform: scale(0.86);
          opacity: 0.75;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <p>Starting Inroad…</p>
    </main>
  </body>
</html>
